metadata:
  name: "permissive"
  version: "1.0"
  description: "Relaxed sandbox policy for development and testing"

filesystem:
  max_file_size: 104857600  # 100MB
  allowed_paths:
    - "/tmp/**"
    - "/home/**"
  denied_paths:
    - "/etc/sudoers"
    - "/root/**"

network:
  allowed_hosts:
    - "*.example.com"
    - "localhost"
    - "127.0.0.1"
  denied_hosts:
    - "*.internal.corp"
  allowed_ports: [80, 443, 8000, 8080, 5000]
  denied_ports: []

processes:
  allowed_commands:
    - "python*"
    - "curl"
    - "wget"
    - "git"
  denied_commands:
    - "rm -rf"
    - "dd"
    - "mkfs"

secrets:
  protected_vars:
    - "AWS_*"
    - "GCP_*"

resources:
  max_memory_mb: 1024
  max_timeout_seconds: 300
  max_file_ops: 10000
  max_network_requests: 1000
